name: cge-dev
channels:
- conda-forge
- nodefaults
dependencies:
- python 3.12.*
- python >=3.12
- numpy <3
- numba <1
- pytensor >=3.3.8,<4
- cvxpy <2
- pip
- pip:
  - pre-commit
  - pytest>=9.0.3
  - pytest-cov>=7.1.0
  - pytest-env
  - jax
  - squarify
  - ipython<10
  - jupyter-sphinx
  - myst-nb
  - numpydoc
  - sphinx>=9.1.0
  - sphinx-copybutton
  - sphinx-design
  - sphinx-notfound-page
  - sphinx-sitemap
  - sphinx-codeautolink
  - pybtex
  - pydata-sphinx-theme
  - watermark
  - -e ..
  - arviz<2
  - better-optimize>=0.5.1, <1
  - latextable<2
  - matplotlib<4
  - networkx<4
  - pandas<4
  - rich<16
  - scipy<2
  - texttable<2
  - xarray<2027

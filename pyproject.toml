[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cge_modeling"
dynamic = ['version']
requires-python = ">=3.12"
authors = [{name="Jesse Grabowski", email='jessegrabowski@gmail.com'}]
description = "Computable general equlibrium models and policy simulation via autodiff with Pytensor"
readme = 'README.md'
license = { file = 'LICENSE.txt'}
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

keywords = [
    "computable general equlibrium",
    "partial general equlibrium",
    "economics",
    "macroeconomics",
    "numerical",
    "simulation",
    "autodiff",
]

dependencies = [
    "arviz<2",
    "better-optimize>=0.5.1,<1",
    "cvxpy<2",
    "ipython<10",
    "joblib<2",
    "latextable<2",
    "matplotlib<4",
    "numba<1",
    "numpy<3",
    "pandas<4",
    "pytensor>=3.3.8,<4",
    "rich<16",
    "scipy<2",
    "sympy>=1.14.0,<2",
    "sympytensor>=2.2.0,<3",
    "texttable<2",
    "xarray<2027",
  ]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-env",
    "jax",
    "squarify",
]

docs = [
  "ipython<10",
  "jupyter-sphinx",
  "myst-nb",
  "numpydoc",
  "sphinx>=9.1.0",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-notfound-page",
  "sphinx-sitemap",
  "sphinx-codeautolink",
  "sphinxcontrib-bibtex",
  "pydata-sphinx-theme",
  "watermark",
]

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.hooks.vcs]
version-file = "cge_modeling/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    '/.github',
    '/notebooks',
    '/_thumbnails',

]

[tool.hatch.build.targets.wheel]
packages = ["cge_modeling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
xfail_strict = true


[tool.coverage.report]
exclude_lines = [
  "pragma: nocover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP", "W", "RUF"]
ignore = [
  "E501",
  "RUF001", # String contains ambiguous character (such as Greek letters)
  "RUF002", # Docstring contains ambiguous character (such as Greek letters)
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D200",
  "D202",
  "D203",
  "D204",
  "D205",
  "D209",
  "D212",
  "D213",
  "D301",
  "D400",
  "D401",
  "D403",
  "D413",
  "D415",
  "D417",
]

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
'tests/*.py' = [
    'F841', # Unused variable warning for test files -- common in pymc model declarations
    'D106',  # Missing docstring for public method -- unittest test subclasses don't need docstrings
    'F401', # Unused import warning for test files -- this check removes imports of fixtures
    'F811',  # Redefine while unused -- this check fails on imported fixtures
]
'cge_modeling/__init__.py' = [
    'F401', # Unused import warning -- need to import (but not use) pytensor rewrite
    'I001' # Import order matters to avoid circular imports
]
